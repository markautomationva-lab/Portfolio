<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
 <title id="title">Solara outbound call after form submission</title>
 <desc id="desc">A submitted solar enquiry leads to an outbound callback from Sophie, Solara’s AI adviser, when the visitor has given call consent. A phone shows Calling your lead with ringing arcs.</desc>
 <defs>
  <radialGradient id="paper"><stop stop-color="#faf8ef"/><stop offset="1" stop-color="#e1ded0"/></radialGradient>
  <linearGradient id="edge" x2="1" y2="1"><stop stop-color="#9ba7a7"/><stop offset=".35" stop-color="#f3f1e8"/><stop offset=".6" stop-color="#5c6c70"/><stop offset="1" stop-color="#a3acaa"/></linearGradient>
  <linearGradient id="screen" x2=".4" y2="1"><stop stop-color="#f9f7ee"/><stop offset="1" stop-color="#d5dcd6"/></linearGradient>
  <filter id="shadow" x="-50%" y="-40%" width="200%" height="200%"><feDropShadow dx="9" dy="24" stdDeviation="22" flood-color="#263e44" flood-opacity=".2"/></filter>
 </defs>
 <rect width="1600" height="900" fill="url(#paper)"/>
 <g font-family="Arial, sans-serif" fill="#476a91">
  <text x="100" y="93" font-size="17" letter-spacing="3">SOLARA SOLAR</text>
  <text x="100" y="207" fill="#115578" font-size="16" letter-spacing="2">SPEED-TO-LEAD</text>
  <g fill="#35464b" font-family="Georgia, serif" font-size="67"><text x="96" y="300">An enquiry sent.</text><text x="96" y="385">A conversation</text><text x="96" y="470">begins.</text></g>
  <g transform="translate(100 535)">
   <rect width="440" height="111" rx="16" fill="#f9f7f0" stroke="#c8c9bd"/>
   <circle cx="43" cy="54" r="19" fill="#476a69"/>
   <path d="m34 54 6 6 12-13" fill="none" stroke="#fffdf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
   <text x="78" y="45" font-size="20" fill="#35464b">Enquiry form submitted</text>
   <text x="78" y="77" font-size="15" fill="#667573">Call consent provided</text>
  </g>
  <path d="M564 589 H705 Q739 589 739 554 V465 Q739 435 775 435 H872" fill="none" stroke="#115578" stroke-width="2" stroke-dasharray="5 8"/>
  <path d="m861 427 12 8-12 8" fill="none" stroke="#115578" stroke-width="2"/>
  <text x="100" y="743" font-size="19" fill="#35464b">Sophie calls the lead to discuss their solar enquiry.</text>
  <text x="100" y="777" font-size="16" fill="#667573">Website form → lead record → consented outbound call</text>
  <text x="100" y="848" font-size="14">markautomates.</text>
  <text x="1500" y="848" text-anchor="end" font-size="13" fill="#667573">Illustrative callback flow</text>
 </g>
 <g transform="translate(1010 116) rotate(5 158 326)" filter="url(#shadow)">
  <rect x="-7" y="104" width="8" height="52" rx="4" fill="#68787c"/>
  <rect x="-7" y="176" width="8" height="68" rx="4" fill="#68787c"/>
  <rect x="320" y="168" width="7" height="83" rx="3" fill="#68787c"/>
  <rect width="322" height="654" rx="49" fill="url(#edge)" stroke="#697a7d" stroke-width="2"/>
  <rect x="7" y="7" width="308" height="640" rx="43" fill="#25383f"/>
  <rect x="13" y="13" width="296" height="628" rx="37" fill="url(#screen)"/>
  <rect x="108" y="22" width="106" height="25" rx="13" fill="#25383f"/>
  <g font-family="Arial,sans-serif" text-anchor="middle">
   <text x="161" y="101" fill="#476a69" font-size="12" letter-spacing="2">SOLARA SOLAR</text>
   <text x="161" y="155" fill="#35464b" font-family="Georgia,serif" font-size="30">Outbound call</text>
   <text x="161" y="186" fill="#667573" font-size="15">Calling your lead…</text>
   <circle cx="161" cy="310" r="66" fill="#476a69"/>
   <path d="M138 282c-4 0-8 6-7 12 4 25 21 42 44 47 7 1 13-3 13-8l-1-10-13-6-7 8c-9-5-17-13-21-21l7-7-6-14z" fill="#f6f3e8"/>
   <g fill="none" stroke="#476a69" stroke-width="2.5" stroke-linecap="round"><path d="M73 287q-13 23 0 46M59 277q-20 33 0 66M249 287q13 23 0 46M263 277q20 33 0 66"/></g>
   <text x="161" y="429" fill="#35464b" font-size="20">Sophie</text>
   <text x="161" y="458" fill="#667573" font-size="14">Solara’s AI solar adviser</text>
   <rect x="45" y="501" width="232" height="44" rx="22" fill="#edf0e8" stroke="#b5c2b7"/>
   <text x="161" y="529" fill="#476a69" font-size="13">Following up your enquiry</text>
  </g>
  <rect x="113" y="620" width="96" height="4" rx="2" fill="#5f6f70"/>
 </g>
</svg>
