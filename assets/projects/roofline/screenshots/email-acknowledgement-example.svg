<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Roofline enquiry email example</title><desc id="desc">An email interface displays an example customer acknowledgement following a roofing enquiry.</desc><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#35464b" flood-opacity=".13"/></filter><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf7ee"/><stop offset="1" stop-color="#e4dfd2"/></linearGradient></defs><rect width="1600" height="900" fill="url(#paper)"/><g font-family="Arial,sans-serif" fill="#35464b"><text x="95" y="90" font-size="17" letter-spacing="3" fill="#476a91">ROOFLINE</text><text x="95" y="222" font-size="16" letter-spacing="2" fill="#115578">ENQUIRY FOLLOW-UP</text><g font-family="Georgia,serif" font-size="60"><text x="92" y="328">Your request.</text><text x="92" y="409">Acknowledged.</text></g><text x="95" y="502" font-size="22" fill="#687574">An email that sets expectations.</text><text x="95" y="549" font-size="17" fill="#687574">Acknowledgement is separate from a confirmed booking.</text><g filter="url(#shadow)"><rect x="756" y="170" width="748" height="554" rx="19" fill="#fffdf7"/><path d="M775 170h710q19 0 19 19v45H756v-45q0-19 19-19" fill="#e8e4d9"/><circle cx="785" cy="202" r="5" fill="#115578"/><circle cx="806" cy="202" r="5" fill="#b5afa1"/><circle cx="827" cy="202" r="5" fill="#b5afa1"/><text x="871" y="207" font-size="15" fill="#687574">Roofline · Email acknowledgement</text><text x="796" y="290" font-size="25">We’ve received your roofing enquiry</text><text x="796" y="331" font-size="15" fill="#687574">From: Roofline</text><text x="796" y="359" font-size="15" fill="#687574">To: Enquiry contact</text><path d="M796 383h666" stroke="#e1ddd3"/><g font-size="19"><text x="796" y="427">Hello,</text><text x="796" y="473">Thank you for getting in touch with Roofline.</text><text x="796" y="508">We’ve received the details of your roofing request.</text><text x="796" y="554">Our team will review your enquiry and follow up</text><text x="796" y="589">about the appropriate next step.</text><text x="796" y="653">The Roofline team</text></g></g><text x="95" y="841" font-size="14" fill="#476a91">markautomates.</text><text x="1505" y="841" text-anchor="end" font-size="14" fill="#687574">Illustrative message · not a delivery record</text></g></svg>