<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Roofline SMS follow-up example</title><desc id="desc">A phone displays an example acknowledgement of a roofing enquiry.</desc><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#35464b" flood-opacity=".13"/></filter><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#faf7ee"/><stop offset="1" stop-color="#e4dfd2"/></linearGradient></defs><rect width="1600" height="900" fill="url(#paper)"/><g font-family="Arial,sans-serif" fill="#35464b"><text x="95" y="90" font-size="17" letter-spacing="3" fill="#476a91">ROOFLINE</text><text x="95" y="222" font-size="16" letter-spacing="2" fill="#115578">ENQUIRY FOLLOW-UP</text><g font-family="Georgia,serif" font-size="66"><text x="92" y="326">An enquiry received.</text><text x="92" y="411">A reassuring reply.</text></g><text x="95" y="506" font-size="23" fill="#687574">A clear next step, sent by SMS.</text><text x="95" y="557" font-size="17" fill="#687574">For enquiries that meet the configured SMS conditions.</text><g filter="url(#shadow)"><rect x="994" y="103" width="350" height="652" rx="48" fill="#36484c"/><rect x="1004" y="113" width="330" height="632" rx="39" fill="#faf9f3"/><rect x="1116" y="125" width="106" height="22" rx="11" fill="#36484c"/><text x="1169" y="214" text-anchor="middle" font-size="22">Roofline</text><text x="1169" y="244" text-anchor="middle" font-size="13" fill="#687574">SMS · example conversation</text><path d="M1032 284h269v291h-239l-30 18z" fill="#e5e9df"/><g font-size="18"><text x="1055" y="325">Thanks for your roofing</text><text x="1055" y="354">enquiry. We’ve received</text><text x="1055" y="383">your request and will</text><text x="1055" y="412">review the details.</text><text x="1055" y="461">The team will follow up</text><text x="1055" y="490">about the next step.</text><text x="1055" y="539">— Roofline</text></g><rect x="1050" y="651" width="238" height="39" rx="20" fill="#eeece5"/><text x="1070" y="676" font-size="13" fill="#87908d">Text message</text><rect x="1120" y="720" width="98" height="4" rx="2" fill="#687574"/></g><text x="95" y="841" font-size="14" fill="#476a91">markautomates.</text><text x="1505" y="841" text-anchor="end" font-size="14" fill="#687574">Illustrative message · not a delivery record</text></g></svg>